[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "team-energy-service"
version = "0.1.0"
description = "Private cached API and status history for Team Energy charging stations"
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.5,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.2,<2",
  "pytz>=2025.2",
  "uvicorn[standard]>=0.34,<1",
  "XlsxWriter>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools.packages.find]
include = ["team_energy_service*"]

[tool.setuptools.package-data]
team_energy_service = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
